[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchiq"
version = "0.1.0"
description = "ML pipeline for predicting international football match outcomes"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "shap>=0.44",
    "streamlit>=1.32",
    "plotly>=5.20",
    "joblib>=1.3",
]

[tool.setuptools.packages.find]
include = ["src*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
