[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchiq"
version = "0.1.0"
description = "ML pipeline for predicting international football match outcomes"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "shap>=0.44",
    "streamlit>=1.32",
    "plotly>=5.20",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "optuna>=3.5",
    "kaggle>=1.6",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["src*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (let formatter handle it)
    "B008",   # do not perform function calls in argument defaults
    "SIM108", # use ternary operator (can reduce readability in ML code)
    "N803",   # argument name should be lowercase (X is conventional in ML)
    "N806",   # variable name should be lowercase (X, Y are conventional in ML)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]
"scripts/*" = ["B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["src", "app"]
