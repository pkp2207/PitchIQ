[theme]
primaryColor = "#FF6B35"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"

[client]
showErrorDetails = false
toolbarMode = "minimal"

[server]
headless = true
port = 8501
runOnSave = false
maxUploadSize = 200

[logger]
level = "info"

[browser]
gatherUsageStats = false
